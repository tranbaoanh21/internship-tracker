services:
  db:
    image: mysql:8.4
    cpus: 1.0
    mem_limit: 1g
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-internship_tracker}
      MYSQL_USER: ${MYSQL_USER:?Set MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-}
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped
    logging: &default-logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          password="$${MYSQL_PASSWORD:-$$(cat "$${MYSQL_PASSWORD_FILE:-/dev/null}" 2>/dev/null)}";
          MYSQL_PWD="$$password" mysql -h127.0.0.1 -u"$$MYSQL_USER" "$$MYSQL_DATABASE" -e 'SELECT 1' >/dev/null
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  redis:
    image: redis:8-alpine
    cpus: 0.5
    mem_limit: 256m
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    logging: *default-logging

  backend:
    image: ghcr.io/tranbaoanh21/internship-application-tracker-backend:${RELEASE_TAG:?Set RELEASE_TAG to a shared immutable sha-* tag}
    cpus: 1.0
    mem_limit: 512m
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-internship_tracker}
      DB_USER: ${MYSQL_USER:?Set MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD:-}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Ho_Chi_Minh}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
      COOKIE_SECURE: "true"
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      OWNER_EMAIL: ${OWNER_EMAIL:?Set OWNER_EMAIL}
      OWNER_PASSWORD: ${OWNER_PASSWORD:-}
      REDIS_URL: redis://redis:6379
      API_DOCS_ENABLED: ${API_DOCS_ENABLED:-false}
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12

  reminder-worker:
    image: ghcr.io/tranbaoanh21/internship-application-tracker-backend:${RELEASE_TAG:?Set RELEASE_TAG to a shared immutable sha-* tag}
    cpus: 0.75
    mem_limit: 384m
    command: ["node", "backend/scripts/reminder-worker.js"]
    environment:
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-internship_tracker}
      DB_USER: ${MYSQL_USER:?Set MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD:-}
      OWNER_EMAIL: ${OWNER_EMAIL:?Set OWNER_EMAIL}
      OWNER_PASSWORD: ${OWNER_PASSWORD:-}
      COOKIE_SECURE: "true"
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      REDIS_URL: redis://redis:6379
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      backend:
        condition: service_healthy
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "backend/scripts/worker-healthcheck.js"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 90s

  frontend:
    image: ghcr.io/tranbaoanh21/internship-application-tracker-frontend:${RELEASE_TAG:?Set RELEASE_TAG to a shared immutable sha-* tag}
    cpus: 0.5
    mem_limit: 128m
    ports:
      - "127.0.0.1:8080:80"
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  mysql_data:
  redis_data:
