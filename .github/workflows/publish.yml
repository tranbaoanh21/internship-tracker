name: Publish containers

on:
  push:
    branches: [main]
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gates:
    uses: ./.github/workflows/quality.yml
    permissions:
      contents: read

  publish:
    needs: quality-gates
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    strategy:
      matrix:
        include:
          - component: backend
            dockerfile: backend/Dockerfile
          - component: frontend
            dockerfile: frontend/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/tranbaoanh21/internship-application-tracker-${{ matrix.component }}
          tags: |
            type=sha,format=long
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}
      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Attest image provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/tranbaoanh21/internship-application-tracker-${{ matrix.component }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  verify-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      attestations: read
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify attestations
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          gh attestation verify "oci://ghcr.io/tranbaoanh21/internship-application-tracker-backend:${IMAGE_TAG}" -R "${GITHUB_REPOSITORY}"
          gh attestation verify "oci://ghcr.io/tranbaoanh21/internship-application-tracker-frontend:${IMAGE_TAG}" -R "${GITHUB_REPOSITORY}"
      - name: Pull and boot the immutable release
        env:
          RELEASE_TAG: sha-${{ github.sha }}
          MYSQL_ROOT_PASSWORD: ci-root-password
          MYSQL_USER: tracker
          MYSQL_PASSWORD: ci-tracker-password
          OWNER_EMAIL: owner@example.com
          OWNER_PASSWORD: correct-horse-battery-staple
        run: |
          docker compose -f docker-compose.release.yml pull
          docker compose -f docker-compose.release.yml up -d --wait
      - name: Smoke test health and authenticated CRUD
        env:
          RELEASE_TAG: sha-${{ github.sha }}
          MYSQL_ROOT_PASSWORD: ci-root-password
          MYSQL_USER: tracker
          MYSQL_PASSWORD: ci-tracker-password
          OWNER_EMAIL: owner@example.com
          OWNER_PASSWORD: correct-horse-battery-staple
        run: |
          curl --fail --silent http://127.0.0.1:8080/api/health
          curl --fail --silent --dump-header login-headers.txt --header 'Content-Type: application/json' --data '{"email":"owner@example.com","password":"correct-horse-battery-staple"}' http://127.0.0.1:8080/api/auth/login > login.json
          csrf="$(jq -r '.data.csrfToken' login.json)"
          session="$(awk 'tolower($1) == "set-cookie:" && $2 ~ /^__Host-tracker_session=/ { split($2, pair, "="); split(pair[2], value, ";"); print value[1] }' login-headers.txt)"
          test -n "${session}"
          curl --fail --silent --header "Cookie: __Host-tracker_session=${session}" --header "X-CSRF-Token: ${csrf}" --header 'Content-Type: application/json' --data '{"company":"Release smoke","position":"Platform Intern"}' http://127.0.0.1:8080/api/applications
          curl --fail --silent --header "Cookie: __Host-tracker_session=${session}" http://127.0.0.1:8080/api/applications | jq -e '.data | length == 1'
      - if: always()
        env:
          RELEASE_TAG: sha-${{ github.sha }}
          MYSQL_ROOT_PASSWORD: ci-root-password
          MYSQL_USER: tracker
          MYSQL_PASSWORD: ci-tracker-password
          OWNER_EMAIL: owner@example.com
          OWNER_PASSWORD: correct-horse-battery-staple
        run: docker compose -f docker-compose.release.yml logs --no-color
      - if: always()
        env:
          RELEASE_TAG: sha-${{ github.sha }}
          MYSQL_ROOT_PASSWORD: ci-root-password
          MYSQL_USER: tracker
          MYSQL_PASSWORD: ci-tracker-password
          OWNER_EMAIL: owner@example.com
          OWNER_PASSWORD: correct-horse-battery-staple
        run: docker compose -f docker-compose.release.yml down -v
