services:
  db-restore:
    image: mysql:8.4
    profiles: ["drill"]
    environment:
      MYSQL_ROOT_PASSWORD: restore_root_password
      MYSQL_DATABASE: internship_tracker_restore
      MYSQL_USER: tracker_restore
      MYSQL_PASSWORD: restore_tracker_password
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h127.0.0.1 -u$$MYSQL_USER $$MYSQL_DATABASE -e 'SELECT 1' >/dev/null"]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 15s
